name: Deploy to AWS Lambda

on:
  push:
    branches:
      - ai-service-lambda-prod
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1             
  LAMBDA_FUNCTION_NAME: ai-service-prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Zip Lambda code
        run: zip -r function.zip . -x "*.git*" "*.github*" "node_modules/aws-sdk/*" "tests/*" "**/*.spec.ts" "vitest.config.ts" "vitest.setup.ts"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://function.zip

      - name: Verify deployment
        run: aws lambda get-function --function-name ${{ env.LAMBDA_FUNCTION_NAME }}